[package]
name = "tagporter"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rust-htslib = "0.43"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[[bench]]
name = "my_benchmark"
harness = false

