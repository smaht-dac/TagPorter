name: Release

# Pushing a tag like v0.2.0 builds all platforms and publishes a GitHub Release.
# A tag with a suffix (v0.2.0-rc1) publishes a pre-release.
# "Run workflow" (workflow_dispatch) builds and uploads artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run inside manylinux_2_28 (glibc 2.28) so the binaries
          # work on RHEL/Rocky/Alma 8+, Ubuntu 20.04+ and Debian 10+.
          - asset: tagporter-linux-x86_64
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - asset: tagporter-linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - asset: tagporter-macos-aarch64
            os: macos-15
            container: ""
          - asset: tagporter-macos-x86_64
            os: macos-15-intel
            container: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      # Oldest macOS the binaries support; honored by rustc, cc and cmake.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      # The vendored OpenSSL build (openssl-sys/vendored via hts-sys) needs
      # these Perl modules. CMake and gcc already ship with manylinux.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: dnf install -y perl-IPC-Cmd perl-Time-Piece

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Build and test
        run: cargo test --release

      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          max=$(objdump -T target/release/tagporter | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest required glibc symbol: $max"
          if [ "$(printf '%s\n' GLIBC_2.28 "$max" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::Binary requires $max, newer than GLIBC_2.28"
            exit 1
          fi

      - name: Show linked libraries (macOS)
        if: runner.os == 'macOS'
        run: otool -L target/release/tagporter

      - name: Smoke test
        run: target/release/tagporter --version

      - name: Stage binary
        run: cp target/release/tagporter "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tagporter-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tagporter-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
